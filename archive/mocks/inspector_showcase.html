      if (preset === 'dossier') {
        const artInner = u.emblem
          ? `<svg class="emblem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVG_ICONS[u.emblem]}</svg>`
          : `<img src="../../assets/${u.slug}-urban-anime-v2.png" alt="${esc(u.name)}">`;
        return `
          <div class="ds-head">
            <div class="ds-portrait-box">
              ${artInner}
              <span class="ds-role-corner">${svgIcon(u.role)}</span>
            </div>
            <div class="ds-meta">
              <div>
                <div class="ds-meta-top">
                  <span class="ds-role-text">${esc(u.role)} / ${esc(u.roleName)}</span>
                  <span class="ds-team-text">${teamLabel}</span>
                </div>
                <h2>${esc(u.name)}</h2>
              </div>
              <div class="ds-metrics">
                <div class="ds-hp-wrap">
                  <div class="ds-num-row"><span>HP</span><b>${hp}<small>/${u.maxHp}</small></b></div>
                  <div class="ds-bar"><i style="width:${pct}%"></i></div>
                </div>
                <div class="ds-atk-wrap">
                  <span>ATK</span>
                  <b class="${hasAtk ? '' : 'is-none'}">${atkText}</b>
                </div>
              </div>
            </div>
          </div>

          <div class="insp-scroll ds-body">
            ${showRich ? `
              <div class="ds-status-row">
                <span class="ds-tag shield">SHIELD +15 (2T)</span>
                ${hasAtk ? `<span class="ds-tag buff">ATK +5 (1T)</span>` : ''}
                <span class="ds-tag debuff">弱体化 (1T)</span>
                <span class="ds-tag">足元: ディメンション</span>
              </div>
            ` : ''}

            <div class="ds-skill-list">
              ${u.desc ? `<div class="ds-skill-row"><div class="ds-skill-head"><span class="ds-skill-title"><span class="ds-kind">SPEC</span><strong>ユニット仕様</strong></span></div><div class="ds-skill-desc">${esc(u.desc)}</div></div>` : ''}
              ${u.passive ? `
                <div class="ds-skill-row">
                  <div class="ds-skill-head">
                    <span class="ds-skill-title"><span class="ds-kind">PASSIVE</span><strong>${esc(u.passive.name)}</strong></span>
                    <span class="ds-stock">PERMANENT</span>
                  </div>
                  <div class="ds-skill-desc">${esc(u.passive.desc)}</div>
                </div>
              ` : ''}
              ${u.skillA ? `
                <button class="ds-skill-row interactive ${isArmed ? 'armed' : ''} ${isDisabled ? 'disabled' : ''}" data-toggle-armed>
                  <div class="ds-skill-head">
                    <span class="ds-skill-title"><span class="ds-kind skill">SKILL</span><strong>${esc(u.skillA.name)}</strong></span>
                    <span class="ds-stock">${skillStateText}</span>
                  </div>
                  <div class="ds-skill-desc">${esc(u.skillA.desc)}</div>
                </button>
              ` : ''}
              ${u.ult ? `
                <button class="ds-skill-row interactive ${!showRich || isDisabled ? 'disabled' : ''}">
                  <div class="ds-skill-head">
                    <span class="ds-skill-title"><span class="ds-kind ult">ULT</span><strong>${esc(u.ult.name)}</strong></span>
                    <span class="ds-stock">${ultStateText}</span>
                  </div>
                  <div class="ds-skill-desc">${esc(u.ult.desc)}</div>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }

      if (preset === 'arcade') {
        const arSkillSub = '';
        const arUltRem = showRich ? 1 : 0;
        const arUltReady = Boolean(showRich && !isDisabled);
        const arUltSub = '';
        const passiveBody = u.passive
          ? `
            <div class="ar-sheet-sec passive-sec">
              <div class="ar-sheet-eyebrow">PASSIVE</div>
              <div class="ar-passive-inline">
                <div class="ar-passive-head">
                  <strong>${esc(u.passive.name)}</strong>
                </div>
                <div class="ar-passive-desc">${esc(u.passive.desc)}</div>
              </div>
            </div>
          `
          : u.desc
            ? `
              <div class="ar-sheet-sec passive-sec">
                <div class="ar-sheet-eyebrow">SPEC</div>
                <div class="ar-passive-inline">
                  <div class="ar-passive-head">
                    <strong>ユニット仕様</strong>
                  </div>
                  <div class="ar-passive-desc">${esc(u.desc)}</div>
                </div>
              </div>
            `
            : '';
        return `
          <div class="ar-piece-hero">
            <div class="ar-banner">
              ${artHtml}
              <div class="ar-pills">
                <span class="ar-role-pill">${svgIcon(u.role)}<span>${esc(u.roleName)}</span></span>
              </div>
              <h2 class="ar-banner-name">${esc(u.name)}</h2>
            </div>

            <div class="ar-piece-dock">
              <div class="ar-dock-cap-wrap">
                <svg class="ar-dock-cap-svg" viewBox="0 0 536 48" preserveAspectRatio="none" aria-hidden="true">
                  <path d="M 0,2 L 144,2 Q 150,2 154,8 L 166,34 Q 170,40 176,40 L 434,40 Q 440,40 444,35 L 453,16 Q 457,10 463,10 L 536,10 L 536,48 L 0,48 Z" fill="#101115" stroke="none"/>
                  <path d="M 0,2 L 144,2 Q 150,2 154,8 L 166,34 Q 170,40 176,40 L 434,40 Q 440,40 444,35 L 453,16 Q 457,10 463,10 L 536,10" fill="none" stroke="#3c3e47" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
                </svg>
                <div class="ar-dock-values">
                  <div class="ar-dock-stat hp-side">
                    <span class="ar-dk-lbl">HP</span>
                    <strong class="ar-dk-hp ${shield > 0 ? 'has-shield' : ''}">${displayHp}<small>/${u.maxHp}</small></strong>
                  </div>
                  <div class="ar-dock-stat atk-side">
                    <span class="ar-dk-lbl">ATK</span>
                    <strong class="ar-dk-atk ${hasAtk ? (showRich ? 'is-buffed' : '') : 'is-none'}">${atkText}</strong>
                  </div>
                </div>
              </div>
              <div class="ar-unit-sheet-body">
                <div class="ar-dock-bar-wrap">
                  <div class="ar-skew-bar"><i class="hp-fill" style="width:${hpPctExact.toFixed(2)}%"></i>${shieldPctExact > 0 ? `<i class="shield-fill" style="width:${shieldPctExact.toFixed(2)}%"></i>` : ''}</div>
                </div>
                <div class="ar-sheet-sec">
                  <div class="ar-sheet-eyebrow">STATES</div>
                  <div class="ar-states-dock">
                    <div class="ar-state-strip">
                      ${arStatesHtml(showRich, hasAtk)}
                    </div>
                  </div>
                </div>
                ${passiveBody}
              </div>
            </div>
          </div>

          <div class="insp-scroll ar-skills">
            ${u.skillA ? `
              <button class="ar-card interactive ${isArmed ? 'armed' : ''} ${isDisabled ? 'disabled' : ''}" data-toggle-armed="skill">
                <span class="ar-tag-tab"><span>SKILL</span></span>
                <div class="ar-card-body">
                  <div class="ar-card-top">
                    <strong>${esc(u.skillA.name)}</strong>
                    <span class="ar-stock-wrap">
                      ${arDotsHtml(u.skillA.stock, u.skillA.maxStock)}
                      ${arSkillSub ? `<span class="ar-stock-state">${arSkillSub}</span>` : ''}
                    </span>
                  </div>
                  <div class="ar-card-desc">${esc(u.skillA.desc)}</div>
                </div>
              </button>
            ` : ''}
            ${u.ult ? `
              <button class="ar-card ult interactive ${arUltReady ? 'is-ready' : ''} ${isUltArmed && !isDisabled ? 'armed' : ''} ${!showRich || isDisabled ? 'disabled' : ''}" data-toggle-armed="ult">
                <span class="ar-tag-tab"><span>ULT</span></span>
                <div class="ar-card-body">
                  <div class="ar-card-top">
                    <strong>${esc(u.ult.name)}</strong>
                    <span class="ar-stock-wrap">
                      ${arDotsHtml(arUltRem, 1)}
                    </span>
                  </div>
                  <div class="ar-card-desc">${esc(u.ult.desc)}</div>
                </div>
              </button>
            ` : ''}
          </div>
        `;
      }

      // Legacy reference
      return `
        <div class="inspector-hero">
          ${artHtml}
          <span class="team-tag">${teamLabel}</span>
          <div class="hero-name"><span>${esc(u.roleName)}</span><h2>${esc(u.name)}</h2></div>
        </div>
        <div class="inspector-stats">
          <div><span>HP</span><strong>${hp}<small>/${u.maxHp}</small></strong><span class="mini-hp"><i style="width:${pct}%"></i></span></div>
          <div><span>ATK</span><strong>${hasAtk ? effectiveAtk : 0}</strong></div>
        </div>
        <div class="insp-scroll card-skills">
          ${u.passive ? `<div class="card-passive"><span class="card-skill-tag">PASSIVE</span><span class="command-copy"><span class="command-top"><strong class="skill-name">${esc(u.passive.name)}</strong><small class="command-sub">PERMANENT</small></span><span class="skill-description">${esc(u.passive.desc)}</span></span></div>` : ''}
          ${u.skillA ? `<button class="card-skill"><span class="card-skill-tag">SKILL</span><span class="command-copy"><span class="command-top"><strong class="skill-name">${esc(u.skillA.name)}</strong><small class="command-sub">${skillStateText}</small></span><span class="skill-description">${esc(u.skillA.desc)}</span></span></button>` : ''}
          ${u.ult ? `<button class="card-skill"><span class="card-skill-tag">ULT</span><span class="command-copy"><span class="command-top"><strong class="skill-name">${esc(u.ult.name)}</strong><small class="command-sub">${ultStateText}</small></span><span class="skill-description">${esc(u.ult.desc)}</span></span></button>` : ''}
        </div>
      `;
    }

    function renderLogBody(preset) {
      const logs = filteredLogs();
      if (preset === 'tactical') {
        let lastTurn = null;
        const rows = logs.map(l => {
          const sep = l.turn !== lastTurn ? `<div class="ct-turn-sep">TURN ${l.turn}</div>` : '';
          lastTurn = l.turn;
          return `${sep}<div class="ct-log-item" data-kind="${l.kind}"><span class="ct-log-tag">${l.tag}</span><div class="ct-log-text">${l.html}</div></div>`;
        }).join('');
        return `
          <div class="ct-log-toolbar">
            <div class="ct-log-filters">
              <button class="ct-filter-btn ${state.logFilter === 'ALL' ? 'active' : ''}" data-logfilter="ALL">ALL (${SAMPLE_LOGS.length})</button>
              <button class="ct-filter-btn ${state.logFilter === 'combat' ? 'active' : ''}" data-logfilter="combat">COMBAT</button>
              <button class="ct-filter-btn ${state.logFilter === 'skill' ? 'active' : ''}" data-logfilter="skill">SKILL/ULT</button>
              <button class="ct-filter-btn ${state.logFilter === 'turn' ? 'active' : ''}" data-logfilter="turn">SYSTEM</button>
            </div>
          </div>
          <div class="insp-scroll ct-log-list">${rows}</div>
        `;
      }

      if (preset === 'dossier') {
        let lastTurn = null;
        const rows = logs.map(l => {
          const sep = l.turn !== lastTurn ? `<div class="ds-log-turn">TURN ${l.turn}</div>` : '';
          lastTurn = l.turn;
          return `${sep}<div class="ds-log-row" data-kind="${l.kind}"><span class="ds-dot"></span><span class="ds-log-cat">${l.tag}</span><span>${l.html}</span></div>`;
        }).join('');
        return `<div class="insp-scroll ds-log-wrap">${rows}</div>`;
      }

      if (preset === 'arcade') {
        const filters = [
          { key: 'ALL', label: `ALL (${SAMPLE_LOGS.length})` },
          { key: 'combat', label: 'COMBAT' },
          { key: 'skill', label: 'SKILL / ULT' },
          { key: 'turn', label: 'SYSTEM' }
        ].map(f => `<button type="button" class="ar-filter-btn ${state.logFilter === f.key ? 'is-active' : ''}" data-logfilter="${f.key}">${f.label}</button>`).join('');

        const groups = [];
        for (const l of logs) {
          let g = groups[groups.length - 1];
          if (!g || g.turn !== l.turn) {
            g = { turn: l.turn, items: [] };
            groups.push(g);
          }
          g.items.push(l);
        }

        const bodyHtml = groups.length
          ? groups.map(g => `
              <section class="ar-log-group">
                <div class="ar-log-turn">TURN ${g.turn}</div>
                <div class="ar-log-rows">
                  ${g.items.map(l => `
                    <div class="ar-log-row" data-kind="${l.kind}">
                      <span class="ar-log-kind">${l.tag}</span>
                      <p>${l.html}</p>
                    </div>
                  `).join('')}
                </div>
              </section>
            `).join('')
          : `<div class="ar-log-empty">NO LOG ENTRIES</div>`;

        return `
          <div class="ar-log-toolbar">${filters}</div>
          <div class="insp-scroll ar-log-list">${bodyHtml}</div>
        `;
      }

      // Legacy reference
      const rows = logs.map(l => `
        <div class="battle-log-entry" data-kind="${l.kind}">
          <div class="battle-log-meta"><span>TURN ${l.turn}</span><strong>${l.label}</strong></div>
          <p>${esc(l.text)}</p>
        </div>
      `).join('');
      return `<div class="insp-scroll log-panel">${rows}</div>`;
    }

    function renderEndTurnBtn() {
      const isDisabled = state.ustate === 'disabled';
      const isEnemy = state.team === 'RED';
      return `
        <div class="endturn-scale-box">
          <div class="sim-endturn-wrap">
            <button type="button" class="sim-endturn-btn ${isDisabled ? 'disabled' : ''}" data-team="${state.team}" data-endturn-preview aria-label="ターン終了。長押しで確定">
              <span class="et-fill"></span>
              <span class="et-content">
                <strong>${isEnemy ? 'ENEMY TURN' : 'END TURN'}</strong>
                <small><span>${isDisabled ? '相手ターン' : '長押しで確定'}</span></small>
              </span>
              <span class="et-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 4 15 12 5 20 5 4"/>
                  <line x1="19" y1="5" x2="19" y2="19"/>
                </svg>
              </span>
            </button>
          </div>
        </div>
      `;
    }

    function renderInspectorBox(preset, mode, caption, showEndTurn = false) {
      const u = UNITS[state.unitKey];
      const presetCls = preset === 'tactical' ? 'st-tactical' : preset === 'dossier' ? 'st-dossier' : preset === 'arcade' ? 'st-arcade' : 'st-legacy';
      const bodyHtml = mode === 'details' ? renderDetailsBody(preset) : renderLogBody(preset);
      const innerHtml = preset === 'arcade'
        ? `${renderTabs(preset, mode)}<div class="ar-panel-body">${bodyHtml}</div>`
        : `${renderTabs(preset, mode)}${bodyHtml}`;
      return `
        <div class="panel-frame-col">
          <div class="panel-caption">${caption}</div>
          <div class="inspector-scale-box">
            <div class="sim-inspector ${presetCls}" data-team="${state.team}" data-role="${u.role}">
              ${innerHtml}
            </div>
          </div>
          ${showEndTurn ? renderEndTurnBtn() : ''}
        </div>
      `;
    }

    function renderAll() {
      document.documentElement.style.setProperty('--pscale', state.pscale);
      const wrap = document.getElementById('stage-wrap');
      if (state.view === 'both') {
        wrap.innerHTML =
          renderInspectorBox(state.preset, 'details', '<b>キャラ詳細</b> · 540×752px + END TURN', true) +
          renderInspectorBox(state.preset, 'log', '<b>戦績ログ</b> · 540×752px', false);
      } else {
        wrap.innerHTML = renderInspectorBox(state.preset, state.singleTab, '<b>統合パネル（タブ切替テスト）</b> · 540×752px + END TURN', true);
      }

      wrap.querySelectorAll('[data-switchtab]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.view === 'single') {
            state.singleTab = btn.dataset.switchtab;
            renderAll();
          }
        });
      });

      wrap.querySelectorAll('[data-logfilter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.logFilter = btn.dataset.logfilter;
          renderAll();
        });
      });

      wrap.querySelectorAll('[data-toggle-armed]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('is-disabled') || btn.classList.contains('disabled')) return;
          const slot = btn.dataset.toggleArmed || 'skill';
          const next = slot === 'ult' ? 'ult_armed' : 'armed';
          state.ustate = state.ustate === next ? 'rich' : next;
          syncStateButtons();
          renderAll();
        });
      });

      wrap.querySelectorAll('[data-endturn-preview]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.classList.contains('disabled')) return;
          btn.classList.toggle('is-holding');
        });
      });
    }

    function syncStateButtons() {
      document.querySelectorAll('[data-ustate]').forEach(b => {
        b.classList.toggle('active', b.dataset.ustate === state.ustate);
      });
    }

    function bindGroup(attr, handler) {
      const btns = [...document.querySelectorAll(`[data-${attr}]`)];
      btns.forEach(btn => {
        btn.addEventListener('click', () => {
          btns.forEach(b => b.classList.remove('active', 'enemy-pill'));
          btn.classList.add('active');
          if (attr === 'team' && btn.dataset.team === 'RED') btn.classList.add('enemy-pill');
          handler(btn.dataset[attr]);
          renderAll();
        });
      });
    }

    bindGroup('preset', val => { state.preset = val; });
    bindGroup('view', val => { state.view = val; });
    bindGroup('pscale', val => { state.pscale = parseFloat(val); });
    bindGroup('team', val => { state.team = val; });
    bindGroup('ustate', val => { state.ustate = val; });
    bindGroup('unit', val => { state.unitKey = val; });
    bindGroup('tagstyle', val => { state.tagStyle = val; });

    const params = new URLSearchParams(window.location.search);
    const initPreset = params.get('preset');
    if (initPreset && ['tactical', 'dossier', 'arcade', 'legacy'].includes(initPreset)) {
      state.preset = initPreset;
      document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === initPreset));
    }
    const initUstate = params.get('ustate');
    if (initUstate && ['normal', 'rich', 'armed', 'ult_armed', 'disabled'].includes(initUstate)) {
      state.ustate = initUstate;
      syncStateButtons();
    }
    const initTag = params.get('tag');
    if (initTag && ['a', 'b', 'c'].includes(initTag)) {
      state.tagStyle = initTag;
      document.querySelectorAll('[data-tagstyle]').forEach(b => b.classList.toggle('active', b.dataset.tagstyle === initTag));
    }
    const initUnit = params.get('unit');
    if (initUnit && UNITS[initUnit]) {
      state.unitKey = initUnit;
      document.querySelectorAll('[data-unit]').forEach(b => b.classList.toggle('active', b.dataset.unit === initUnit));
    }

    renderAll();
  </script>
</body>
</html>
